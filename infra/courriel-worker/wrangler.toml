# Email Worker de House OS : documents@<votre-domaine> → bucket R2 houseos-courriel.
# Déploiement : npx wrangler deploy (voir README.md). Les vars ci-dessous priment sur
# celles du tableau de bord à chaque deploy — c'est ici qu'elles vivent.
name = "houseos-courriel"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Pas d'URL *.workers.dev : ce Worker n'a pas de handler HTTP, il ne reçoit que du courriel.
workers_dev = false

[[r2_buckets]]
binding = "COURRIELS"
bucket_name = "houseos-courriel"

[vars]
# Adresses (enveloppe MAIL FROM, minuscules, séparées par des virgules) autorisées à
# déposer — tout le reste est rejeté au SMTP. Vide ici : la vraie liste est passée au
# déploiement (`npx wrangler deploy --var EXPEDITEURS_PERMIS:"a@x.com,b@y.com"`, voir
# README.md) pour ne pas committer d'adresses personnelles.
EXPEDITEURS_PERMIS = ""
PREFIXE = "entrants/"
