name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  serveur:
    name: Serveur (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: server/global.json
      - run: dotnet restore server/HouseOs.sln
      - run: dotnet build server/HouseOs.sln --no-restore -c Release
      # Les tests d'intégration démarrent un Postgres jetable (Testcontainers) :
      # Docker est présent sur ubuntu-latest.
      - run: dotnet test server/HouseOs.sln --no-build -c Release

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t house-os:ci .
