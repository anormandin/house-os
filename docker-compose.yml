# L'app parle à Seq elle-même (Serilog, évènements structurés). Postgres et
# tailscale, eux, ne savent qu'écrire sur stdout : le driver gelf le pousse à
# l'entrée GELF du collecteur, pour qu'ils soient dans la même recherche que le
# reste. UDP : une entrée indisponible ne bloque jamais un conteneur.
# Contrepartie assumée : `docker logs postgres` ne montre plus rien — c'est Seq
# qui garde l'historique, et 14 jours plutôt que 3 fichiers de 10 Mo.
x-journal-conteneur: &journal-conteneur
  driver: gelf
  options:
    gelf-address: "udp://192.168.4.36:12201"
    tag: "{{.Name}}"

# L'app garde json-file : son stdout n'est qu'un double lisible de ce que
# Serilog envoie déjà, et il reste consultable si le collecteur est absent.
x-journal: &journal
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: houseos-postgres
    restart: unless-stopped
    logging: *journal-conteneur
    environment:
      POSTGRES_DB: houseos
      POSTGRES_USER: houseos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis (dans le .env)}
    ports:
      # 127.0.0.1 seulement : l'app passe par le réseau compose, le port hôte ne
      # sert qu'à l'admin local. (5433 : 5432 est pris par un autre projet en dev.)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseos -d houseos"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: houseos-app
    restart: unless-stopped
    logging: *journal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__HouseOs: "Host=postgres;Port=5432;Database=houseos;Username=houseos;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis (dans le .env)}"
      Fichiers__Chemin: /app/donnees/fichiers
      # Clés de chiffrement du cookie de session : sur un volume, sinon chaque
      # rebuild déconnecte le foyer (constaté le 2026-08-29).
      Securite__CheminCles: /app/donnees/protection
      # Journalisation structurée vers le collecteur partagé du lab (LXC 106,
      # dépôt /opt/observabilite) — hors de ce compose exprès : les logs de toutes
      # les apps ne doivent pas dépendre du cycle de vie de house-os. Le tampon
      # disque garde les évènements quand le collecteur redémarre, c'est-à-dire
      # exactement quand on ne veut pas perdre ceux d'un incident.
      Journalisation__Seq__Url: ${JOURNALISATION_SEQ_URL:-http://192.168.4.36:5341}
      Journalisation__Seq__CleApi: ${JOURNALISATION_SEQ_CLE:?JOURNALISATION_SEQ_CLE requise (clé d'ingestion « house-os » dans Seq)}
      Journalisation__Seq__CheminTampon: /app/donnees/journal/tampon-seq
      # Le code vit en heure locale (récurrence, humeur, rollover) : fuseau requis.
      TZ: America/Toronto
      # Derrière NPM (HTTPS → HTTP interne) : X-Forwarded-* n'est honoré QUE depuis
      # ces proxys (IPs ou CIDR, séparés par des virgules) — défaut : le NPM du LAN.
      # Si le cookie Secure ne se pose pas au login HTTPS, Docker réécrit
      # probablement l'IP source : ajouter le sous-réseau du compose (CIDR).
      Reseau__ProxiesConnus: ${RESEAU_PROXIES_CONNUS:-192.168.4.50}
      # Clé du endpoint /mcp — obligatoire en prod, à définir dans le .env du serveur
      # (générer avec : openssl rand -hex 32)
      Mcp__Cle: ${HOUSEOS_MCP_KEY:?HOUSEOS_MCP_KEY requis (openssl rand -hex 32, dans le .env)}
      # Titre d'humeur (facultatif : repli sur la banque de phrases si absent)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Mots de passe initiaux des comptes — appliqués seulement à la création
      # des utilisateurs (base vierge) ; en changer ensuite = SQL. Exigés : un .env
      # incomplet ne doit jamais retomber en silence sur un mot de passe du repo.
      Seed__Utilisateurs__0__MotDePasse: ${SEED_MDP_ALAIN:?SEED_MDP_ALAIN requis (dans le .env)}
      Seed__Utilisateurs__1__MotDePasse: ${SEED_MDP_ARIANE:?SEED_MDP_ARIANE requis (dans le .env)}
      # Base de l'URL publique du flux iCal (Funnel) — vide = l'UI n'affiche que
      # l'URL interne.
      Ical__UrlPubliqueBase: ${ICAL_URL_PUBLIQUE_BASE:-}
    ports:
      - "8080:8080"
    volumes:
      - fichiers:/app/donnees/fichiers   # manuels et photos des équipements (inclus au backup)
      - protection:/app/donnees/protection  # clés du cookie de session (pas de backup : les perdre = une reconnexion)
    healthcheck:
      # /api/sante sonde la DB : 503 (curl -f → échec) si elle est inaccessible.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Seule exposition publique du système : Funnel publie /ical (et rien d'autre —
  # voir infra/tailscale-serve.json) sur https://houseos.<tailnet>.ts.net pour que
  # Google Agenda puisse s'abonner au flux. Démarre seulement avec
  # COMPOSE_PROFILES=funnel (défini dans le .env du serveur, absent en dev).
  tailscale:
    # Épinglé (pas latest) : un funnel qui casse à un pull silencieux serait
    # invisible jusqu'à ce que Google Agenda arrête de se rafraîchir.
    image: tailscale/tailscale:v1.102.3
    container_name: houseos-tailscale
    restart: unless-stopped
    profiles: ["funnel"]
    logging: *journal-conteneur
    hostname: houseos
    depends_on:
      - app
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/tailscale-serve.json
      # Userspace : pas de /dev/net/tun requis (Docker dans un LXC) ; le proxy
      # serve sort vers app:8080 par le réseau compose, ça suffit.
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./infra/tailscale-serve.json:/config/tailscale-serve.json:ro

volumes:
  postgres-data:
  fichiers:
  protection:
  tailscale-state:
