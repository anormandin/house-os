services:
  postgres:
    image: postgres:17-alpine
    container_name: houseos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: houseos
      POSTGRES_USER: houseos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houseos-dev}
    ports:
      - "5433:5432"   # 5433 côté hôte : 5432 est déjà pris par un autre projet sur le Mac de dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseos -d houseos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # server: (ajouté quand HouseOs.Api aura un Dockerfile)
  # web:    (ajouté quand le build web sera servi)

volumes:
  postgres-data:
